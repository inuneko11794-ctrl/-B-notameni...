<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>B.Y.N - Ultimate Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
    details > summary { list-style: none; cursor: pointer; }
    details > summary::-webkit-details-marker { display: none; }
    .glass-panel { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .neon-text { text-shadow: 0 0 10px rgba(6, 182, 212, 0.5); }
    .car-1 { background: #ffffff; color: #000; border: 1px solid #cbd5e1; }
    .car-2 { background: #000000; color: #fff; border: 1px solid #334155; }
    .car-3 { background: #dc2626; color: #fff; }
    .car-4 { background: #2563eb; color: #fff; }
    .car-5 { background: #eab308; color: #000; }
    .car-6 { background: #16a34a; color: #fff; }
    .car-7 { background: #f97316; color: #fff; }
    .car-8 { background: #ec4899; color: #fff; }
    .car-9 { background: #9333ea; color: #fff; }
  </style>
</head>
<body class="font-sans pb-40 selection:bg-cyan-500 selection:text-white">

  <div class="max-w-md mx-auto p-4 space-y-5">
    <header class="text-center pb-4 border-b border-slate-800">
      <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 tracking-wider">B.Y.N ANALYZER</h1>
      <p class="text-[10px] text-cyan-500 tracking-[0.2em] mt-1 uppercase">Stock & Consume Dashboard</p>
    </header>

    <div class="flex bg-slate-900 p-1.5 rounded-xl border border-slate-700 shadow-inner">
      <button onclick="switchMainTab('parse')" id="tab-parse" class="flex-1 py-3 text-xs font-bold bg-slate-800 rounded-lg shadow-lg text-cyan-400 border border-slate-600 transition-all">ストック＆解析</button>
      <button onclick="switchMainTab('dash')" id="tab-dash" class="flex-1 py-3 text-xs font-bold text-slate-500 transition-all">文殊ダッシュボード</button>
    </div>

    <!-- 🌟 ストック＆解析タブ -->
    <div id="view-parse" class="space-y-4">
      <div class="glass-panel p-3 rounded-xl border-blue-500/30 space-y-3">
        <div class="flex justify-between items-center px-1">
          <span class="text-[10px] text-cyan-400 font-bold tracking-widest">📝 レースを追加する</span>
          <div class="flex space-x-1">
            <button onclick="selectTargetSite('B')" id="add-btn-B" class="px-3 py-1 text-[10px] font-bold bg-blue-900 text-blue-300 rounded border border-blue-500 transition-all">B 枠</button>
            <button onclick="selectTargetSite('Y')" id="add-btn-Y" class="px-3 py-1 text-[10px] font-bold bg-slate-800 text-slate-500 rounded border border-slate-700 transition-all">Y 枠</button>
            <button onclick="selectTargetSite('N')" id="add-btn-N" class="px-3 py-1 text-[10px] font-bold bg-slate-800 text-slate-500 rounded border border-slate-700 transition-all">N 枠</button>
          </div>
        </div>
        <div class="relative">
          <textarea id="inputText" rows="3" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-300 focus:ring-2 focus:ring-cyan-500 focus:outline-none" placeholder="出走表をペースト (EXECUTEでストック)"></textarea>
          <button onclick="stockRaceData()" class="absolute -bottom-3 right-2 bg-gradient-to-r from-cyan-500 to-blue-600 active:scale-95 text-white font-bold py-1.5 px-5 rounded-full shadow-[0_0_10px_rgba(6,182,212,0.4)] text-[10px] tracking-wider transition-transform">
            EXECUTE (ストック)
          </button>
        </div>
      </div>

      <div class="pt-4">
        <h3 class="text-[10px] text-slate-400 font-bold tracking-widest mb-2 flex items-center">
          <span>⏳ 発走待ちリスト (未結果)</span>
          <span id="pendingCountBadge" class="ml-2 bg-slate-800 px-2 py-0.5 rounded-full text-cyan-400">0</span>
        </h3>
        <div id="raceTabsContainer" class="flex flex-wrap gap-2"></div>
      </div>

      <div id="raceContentArea" class="hidden space-y-4 mt-2 border-t border-slate-800 pt-4">
        <div class="glass-panel p-3 rounded-xl flex flex-col space-y-1 relative">
          <button onclick="removePendingRace()" class="absolute top-2 right-2 text-slate-500 hover:text-red-400 text-[10px] bg-slate-900 px-2 py-1 rounded border border-slate-700">ストック破棄</button>
          <span class="text-[10px] text-cyan-400 font-bold tracking-widest flex items-center">
            <span>LINE PREDICTION</span>
            <span id="currentRaceBadge" class="ml-3 bg-cyan-900 text-cyan-300 px-2 py-0.5 rounded shadow-sm"></span>
          </span>
          <span class="text-sm font-bold text-slate-100 tracking-wider mt-1" id="lineInfo"></span>
        </div>
        <div id="flagContainer" class="hidden bg-red-950/40 border border-red-500/50 p-3 rounded-xl">
          <h3 class="text-red-400 font-bold mb-2 text-[10px] tracking-wider flex items-center">
            <span class="animate-pulse mr-1">🔴</span> ALERT DETECTED
          </h3>
          <ul id="flagList" class="text-[11px] text-red-200 space-y-1.5 leading-relaxed"></ul>
        </div>
        <div id="playersList" class="space-y-2.5"></div>
      </div>
    </div>

     <!-- 🌟 ダッシュボードタブ -->
    <div id="view-dash" class="hidden space-y-5">
      <div class="glass-panel p-4 rounded-xl space-y-3 border-cyan-500/30">
        <h2 class="font-bold text-xs text-cyan-400 tracking-wider">🏆 サイト別 荒れ予想＆印レポート</h2>
        <div id="bynStats" class="space-y-2 text-xs"></div>
      </div>
      <div class="glass-panel p-4 rounded-xl space-y-3 border-yellow-500/30">
        <h2 class="font-bold text-xs text-yellow-400 tracking-wider flex items-center">
          <span>💣 穴馬の発生ポジション (☆★⑳●▲✖)</span>
          <span class="ml-auto text-[9px] bg-slate-800 px-2 py-0.5 rounded border border-slate-700">直近の傾向</span>
        </h2>
        <div id="mujirushiStats" class="text-[10px] text-slate-300 space-y-2 max-h-48 overflow-y-auto pr-1"></div>
      </div>
      <div class="glass-panel p-4 rounded-xl">
        <h2 class="font-bold mb-4 text-xs text-cyan-400 tracking-wider">3連単配当トレンド</h2>
        <div class="relative h-48 w-full"><canvas id="payoutChart"></canvas></div>
      </div>
      <div class="glass-panel p-4 rounded-xl space-y-3">
        <h2 class="font-bold text-xs text-cyan-400 tracking-wider">同県先頭の信頼度（ブラックリスト）</h2>
        <div id="honestyStats" class="text-xs text-slate-300 space-y-2"></div>
      </div>
      <div class="glass-panel p-4 rounded-xl space-y-3 border-purple-500/30">
        <h2 class="font-bold text-xs text-purple-400 tracking-wider flex items-center">
          <span>💾 データ バックアップ ＆ 復元</span>
        </h2>
        <div class="flex space-x-2">
          <button onclick="exportData()" class="flex-1 bg-purple-900/50 hover:bg-purple-800 text-purple-300 font-bold py-2.5 rounded-lg border border-purple-700 text-xs transition-colors active:scale-95 shadow-lg">📤 保存 (Backup)</button>
          <button onclick="document.getElementById('importFile').click()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-lg border border-slate-600 text-xs transition-colors active:scale-95">📥 読込 (Load)</button>
          <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
        </div>
      </div>
    </div>
  </div>

   <!-- 📝 右下常駐：結果入力ドロワー -->
  <div class="fixed bottom-3 right-3 left-3 z-50 max-w-md mx-auto pb-safe">
    <details id="resultDrawer" class="glass-panel rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.8)] overflow-hidden transition-all group">
      <summary class="px-5 py-4 flex justify-between items-center cursor-pointer bg-slate-800/90 active:bg-slate-700 border-t border-slate-700">
        <div class="flex items-center space-x-2">
          <span class="text-cyan-400 text-lg">📝</span>
          <span class="text-[11px] font-bold text-slate-100 tracking-wider" id="drawerTitle">結果を入力して消化する</span>
        </div>
        <span class="text-[10px] bg-slate-900 border border-slate-600 px-3 py-1 rounded-full text-slate-300 group-open:text-cyan-400">開閉</span>
      </summary>
      
      <div class="p-5 space-y-4 border-t border-slate-700/50 max-h-[75vh] overflow-y-auto">
        <div class="bg-blue-900/30 border border-blue-500/30 p-2 rounded text-[10px] text-blue-300 flex items-center">
          ℹ️ 現在開いている【 <span id="targetRaceDisplay" class="font-bold text-white mx-1">未選択</span> 】のデータを消化し、統計へ送ります。
        </div>

        <div class="flex space-x-3">
          <div class="flex-1 text-center">
            <label class="text-[10px] text-yellow-500 font-bold block mb-1">1着</label>
            <input type="number" inputmode="numeric" id="res1" class="w-full p-3 bg-slate-900 border border-slate-600 rounded-lg text-white text-center font-bold text-lg">
          </div>
          <div class="flex-1 text-center">
            <label class="text-[10px] text-slate-300 font-bold block mb-1">2着</label>
            <input type="number" inputmode="numeric" id="res2" class="w-full p-3 bg-slate-900 border border-slate-600 rounded-lg text-white text-center font-bold text-lg">
          </div>
          <div class="flex-1 text-center">
            <label class="text-[10px] text-orange-400 font-bold block mb-1">3着</label>
            <input type="number" inputmode="numeric" id="res3" class="w-full p-3 bg-slate-900 border border-slate-600 rounded-lg text-white text-center font-bold text-lg">
          </div>
        </div>

        <div class="flex space-x-3">
          <div class="flex-1">
            <label class="text-[10px] text-cyan-500 font-bold block mb-1">2連単 (円)</label>
            <input type="number" inputmode="numeric" id="pay2" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm text-right">
          </div>
          <div class="flex-1">
            <label class="text-[10px] text-cyan-500 font-bold block mb-1">3連単 (円)</label>
            <input type="number" inputmode="numeric" id="pay3" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm text-right">
          </div>
        </div>

        <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700 space-y-2">
          <label class="text-[10px] text-red-400 font-bold block">🚨 同県先頭の評価 (任意)</label>
          <div class="flex space-x-2">
            <input type="number" inputmode="numeric" id="leaderCar" placeholder="車番" class="w-16 p-2 bg-slate-800 border border-slate-600 rounded-lg text-white text-center text-sm">
            <select id="leaderEval" class="flex-1 p-2 bg-slate-800 border border-slate-600 rounded-lg text-white text-[11px] appearance-none">
              <option value="">-- 評価 --</option>
              <option value="good">① 共倒れ (頑張った証拠)</option>
              <option value="normal">② 先頭1着/番手飛 (まぁよし)</option>
              <option value="bad">③ 先頭3着/番手飛 (最悪/信用不可)</option>
              <option value="perfect">④ ライン決着 (仕事した)</option>
            </select>
          </div>
        </div>

        <button onclick="consumeResultData()" class="w-full bg-gradient-to-r from-cyan-600 to-blue-700 active:scale-95 text-white font-bold py-3.5 rounded-lg text-sm tracking-widest shadow-lg transition-transform">
          SAVE & CONSUME (消化)
        </button>
      </div>
    </details>
  </div>

  <script>
    let pendingRaces = JSON.parse(localStorage.getItem('pendingRaces') || '[]'); 
    let db = JSON.parse(localStorage.getItem('bynDB') || '[]'); 
    let honestyDB = JSON.parse(localStorage.getItem('honestyDB') || '[]'); 
    
    let targetSiteForInput = 'B'; 
    let currentSelectedRaceId = null; 
    let chartInstance = null;

    renderPendingTabs();

    function switchMainTab(tab) {
      document.getElementById('view-parse').classList.toggle('hidden', tab !== 'parse');
      document.getElementById('view-dash').classList.toggle('hidden', tab !== 'dash');
      
      document.getElementById('tab-parse').className = tab === 'parse' 
        ? "flex-1 py-3 text-xs font-bold bg-slate-800 rounded-lg shadow-lg text-cyan-400 border border-slate-600" 
        : "flex-1 py-3 text-xs font-bold text-slate-500";
      
      document.getElementById('tab-dash').className = tab === 'dash' 
        ? "flex-1 py-3 text-xs font-bold bg-slate-800 rounded-lg shadow-lg text-cyan-400 border border-slate-600" 
        : "flex-1 py-3 text-xs font-bold text-slate-500";
        
      if (tab === 'dash') renderAllDashboards();
    }

    function selectTargetSite(site) {
      targetSiteForInput = site;
      ['B','Y','N'].forEach(s => {
        document.getElementById(`add-btn-${s}`).className = (s === site)
          ? `px-3 py-1 text-[10px] font-bold bg-blue-900 text-blue-300 rounded border border-blue-500 transition-all`
          : `px-3 py-1 text-[10px] font-bold bg-slate-800 text-slate-500 rounded border border-slate-700 transition-all`;
      });
    }

    function normalizeStamp(rawStamp) {
      if (!rawStamp) return '無';
      const s = rawStamp.trim();
      if (s.includes('本命') || s === '◎') return '◎';
      if (s.includes('対抗') || s === '○' || s === '◯') return '○';
      if (s.includes('連下') || s === '△') return '△';
      if (s.includes('穴') || s === '単穴' || s === '×' || s === '☓' || s === '▲') return '☓';
      return '無';
    }

    function stockRaceData() {
      const text = document.getElementById('inputText').value;
      if(!text) return alert('データを入力してください。');

      const placeMatch = text.match(/（\s*([^\s0-9]+)\s+\d+R\s*）/);
      const defaultPlace = placeMatch ? placeMatch[1] : "";

      const sections = text.split(/={30,}/).filter(s => s.trim() !== '');
      let tempRaceNum = null; let tempText = "";
      let addedCount = 0;

      sections.forEach(section => {
        const match = section.match(/（.+?\s(\d+)R）/);
        if (match) {
          if (tempRaceNum) { processAndStoreRace(tempRaceNum, tempText, defaultPlace); addedCount++; }
          tempRaceNum = match[1]; tempText = section;
        } else {
          if (tempRaceNum) tempText += "\n" + section;
        }
      });
      if (tempRaceNum) { processAndStoreRace(tempRaceNum, tempText, defaultPlace); addedCount++; }
      if(addedCount > 0) {
        document.getElementById('inputText').value = ''; 
        renderPendingTabs();
        alert(`${targetSiteForInput}枠のレースを ${addedCount}件 ストックしました！`);
      } else {
        alert('レース情報が正しく読み取れませんでした。');
      }
    }

    function processAndStoreRace(raceNum, text, defaultPlace) {
      const players = [];
      const flags = [];
      
      const pMatch = text.match(/（\s*([^\s0-9]+)\s+\d+R\s*）/);
      const place = pMatch ? pMatch[1] : defaultPlace;

      // 🌸 ガールズケイリン（L級）判定
      const isGirls = text.includes('ガールズ') || text.includes('L級') || text.includes('L1');

      const lineMatch = text.match(/並び予想:\s*([^※\n]+)/);
      const lineInfo = lineMatch ? lineMatch[1].trim() : "";
      
      const lineMap = {}; 
      const lineStrs = lineInfo.match(/\[([0-9\s]+)\]/g);
      
      let actualLineCount = 0;
      if (lineStrs && !isGirls) {
        lineStrs.forEach((str) => {
          const cars = str.replace(/[\[\]]/g, '').trim().split(/\s+/).map(Number);
          const isTanki = cars.length === 1; 
          
          if (!isTanki) {
            actualLineCount++;
            cars.forEach((cNo, pIdx) => {
              lineMap[cNo] = {
                lIdx: actualLineCount,
                isTanki: false,
                pos: pIdx === 0 ? '先頭' : '番手以降',
                fCar: pIdx > 0 ? cars[pIdx - 1] : null
              };
            });
          } else {
            cars.forEach((cNo) => {
              lineMap[cNo] = { lIdx: null, isTanki: true, pos: '単騎', fCar: null };
            });
          }
        });
    }

    const rawPlayers = [];
      const blocks = text.split(/\[\d+\]/).slice(1);
      blocks.forEach((block) => {
        if (!block.includes("競走得点")) return;
        const carNo = rawPlayers.length + 1; 
        const nameM = block.match(/(.+?)｜/);
        const prefM = block.match(/｜([^\sA-Za-z]+)\s+[A-Z]\d/);
        const scrM = block.match(/競走得点:([\d\.]+)/);
        const hbM = block.match(/H:(\d+) \/ B:(\d+)/);
        const aiM = block.match(/AI印:([^\s/　]+)/);

        if (nameM && scrM && hbM) {
          const name = nameM[1].trim();
          const stamp = normalizeStamp(aiM ? aiM[1] : "");
          const aiScore = (parseFloat(scrM[1]) + (parseInt(hbM[1]) + parseInt(hbM[2])) * 0.5).toFixed(2);
          
          // ガールズは全員単騎扱い
          const posInfo = isGirls 
            ? { lIdx: null, isTanki: true, pos: '単騎', fCar: null }
            : (lineMap[carNo] || { lIdx: null, isTanki: true, pos: '単騎', fCar: null });
          
          rawPlayers.push({ carNo, name, pref: prefM?prefM[1].trim():"", aiScore, stamp, ...posInfo });
        }
      });

      // 💡 無印 発生ポジション判定ロジック (ガールズ戦ではライン非依存の「無」のまま保持)
      rawPlayers.forEach(p => {
        let finalStamp = p.stamp;
        
        if (finalStamp === '無' && !isGirls) {
          const beforeP = rawPlayers.find(x => x.carNo === p.fCar);
          const afterP = rawPlayers.find(x => x.fCar === p.carNo);

          const adjacentStamps = [];
          if (beforeP) adjacentStamps.push(beforeP.stamp);
          if (afterP) adjacentStamps.push(afterP.stamp);

          if (adjacentStamps.includes('◎')) {
            finalStamp = '⑳';
          } else if (adjacentStamps.includes('○')) {
            finalStamp = '●';
          } else if (adjacentStamps.includes('△')) {
            finalStamp = '▲';
          } else if (adjacentStamps.includes('☓')) {
            finalStamp = '✖';
          } else {
            if (p.isTanki || p.pos === '先頭') {
              finalStamp = '☆'; 
            } else {
              if (beforeP && (beforeP.stamp === '無' || beforeP.stamp === '☆')) {
                finalStamp = '★'; 
              } else {
                finalStamp = '無'; 
              }
            }
          }
        }

                         players.push({ ...p, stamp: finalStamp });

        if (['☆','★','⑳','●','▲','✖','△'].includes(finalStamp) && p.aiScore >= 85) {
          flags.push(`【${p.carNo}番 ${p.name} (${finalStamp})】元AI低評価だが独自AIスコア上位！`);
        }
      });

      const newRaceId = `${targetSiteForInput}_${place}_${raceNum}`;
      const raceObj = { id: newRaceId, site: targetSiteForInput, place, raceNum, lineInfo, players, flags, isGirls };
      
      const existIdx = pendingRaces.findIndex(r => r.id === newRaceId);
      if(existIdx > -1) pendingRaces[existIdx] = raceObj;
      else pendingRaces.push(raceObj);
      
      localStorage.setItem('pendingRaces', JSON.stringify(pendingRaces));
    }

    function renderPendingTabs() {
      const container = document.getElementById('raceTabsContainer');
      document.getElementById('pendingCountBadge').innerText = pendingRaces.length;
      container.innerHTML = '';
      
      if(pendingRaces.length === 0) {
        document.getElementById('raceContentArea').classList.add('hidden');
        currentSelectedRaceId = null;
        updateDrawerTarget();
        return;
      }

      const sorted = [...pendingRaces].sort((a,b) => {
        if(a.site !== b.site) return a.site.localeCompare(b.site);
        return parseInt(a.raceNum) - parseInt(b.raceNum);
      });

      sorted.forEach(race => {
        const btn = document.createElement('button');
        const placeName = race.place ? `${race.place}` : '';
        btn.innerText = `[${race.site}] ${placeName}${race.raceNum}R`;
        const isSelected = currentSelectedRaceId === race.id;
        
        btn.className = isSelected
          ? "px-3 py-1.5 bg-cyan-900 border border-cyan-500 text-cyan-300 font-bold rounded-lg text-[11px] shadow-sm"
          : "px-3 py-1.5 bg-slate-800 border border-slate-700 text-slate-400 font-bold rounded-lg text-[11px] hover:bg-slate-700";
        
        btn.onclick = () => showRace(race.id);
        container.appendChild(btn);
      });
      
      if(!currentSelectedRaceId || !pendingRaces.find(r => r.id === currentSelectedRaceId)) {
        showRace(sorted[0].id);
      }
    }

    function showRace(id) {
      currentSelectedRaceId = id;
      const race = pendingRaces.find(r => r.id === id);
      if (!race) return;

      const placeName = race.place ? `${race.place} ` : '';
      document.getElementById('currentRaceBadge').innerText = `${race.site}枠 - ${placeName}${race.raceNum}R${race.isGirls ? ' (ガールズ)' : ''}`;
      document.getElementById('lineInfo').innerText = race.isGirls ? 'ガールズケイリン (単騎戦)' : race.lineInfo;

      document.getElementById('playersList').innerHTML = race.players.sort((a,b) => b.aiScore - a.aiScore).map(p => `
        <div class="glass-panel p-3 rounded-xl flex justify-between items-center">
          <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-full flex items-center justify-center font-black text-sm car-${p.carNo}">${p.carNo}</div>
            <div>
              <div class="font-bold text-slate-100 text-sm">${p.name} <span class="text-[9px] font-normal text-slate-400">(${p.pref})</span></div>
              <div class="text-[9px] text-slate-400 mt-0.5">
                <span class="px-1.5 py-0.5 bg-slate-800 border border-slate-600 rounded text-yellow-400 font-bold mr-1">印: ${p.stamp}</span>
                ${p.isTanki ? '単騎' : `第${p.lIdx}L ${p.pos}`}
              </div>
            </div>
          </div>
          <div class="text-right">
            <div class="text-[8px] text-cyan-500 font-bold mb-0.5">SCORE</div>
            <div class="text-lg font-black text-cyan-400 neon-text">${p.aiScore}</div>
          </div>
        </div>
      `).join('');
      
      const fList = document.getElementById('flagList');
      if (race.flags.length > 0) {
        document.getElementById('flagContainer').classList.remove('hidden');
        fList.innerHTML = race.flags.map(f => `<li>${f}</li>`).join('');
      } else {
        document.getElementById('flagContainer').classList.add('hidden');
      }
      document.getElementById('raceContentArea').classList.remove('hidden');
      renderPendingTabs(); 
      updateDrawerTarget();
    }

    function removePendingRace() {
      if(!currentSelectedRaceId) return;
      if(confirm('このストックを破棄しますか？')) {
        pendingRaces = pendingRaces.filter(r => r.id !== currentSelectedRaceId);
        localStorage.setItem('pendingRaces', JSON.stringify(pendingRaces));
        currentSelectedRaceId = null;
        renderPendingTabs();
      }
    }

    function updateDrawerTarget() {
      const disp = document.getElementById('targetRaceDisplay');
      if(currentSelectedRaceId) {
        const race = pendingRaces.find(r => r.id === currentSelectedRaceId);
        const placeName = race.place ? `${race.place} ` : '';
        disp.innerText = `${race.site}枠 - ${placeName}${race.raceNum}R`;
      } else {
        disp.innerText = "未選択";
      }
    }

    function consumeResultData() {
      if(!currentSelectedRaceId) return alert('対象のレースを選択してください。');
      
      const r1 = parseInt(document.getElementById('res1').value);
      const r2 = parseInt(document.getElementById('res2').value);
      const r3 = parseInt(document.getElementById('res3').value);
      const pay3 = parseInt(document.getElementById('pay3').value) || 0;
      
      if (!r1 || !r2 || !r3) return alert('着順を入力してください');

      const raceData = pendingRaces.find(r => r.id === currentSelectedRaceId);
      const newId = Date.now();

      db.unshift({ 
        id: newId, site: raceData.site, place: raceData.place || '', raceNum: raceData.raceNum,
        r1, r2, r3, pay3, isMansha: pay3 >= 10000, players: raceData.players 
      });
      localStorage.setItem('bynDB', JSON.stringify(db));

      const lCar = document.getElementById('leaderCar').value;
      const lEval = document.getElementById('leaderEval').value;
      if (lCar && lEval) {
        honestyDB.unshift({ id: newId, car: parseInt(lCar), eval: lEval });
        localStorage.setItem('honestyDB', JSON.stringify(honestyDB));
      }

      pendingRaces = pendingRaces.filter(r => r.id !== currentSelectedRaceId);
      localStorage.setItem('pendingRaces', JSON.stringify(pendingRaces));
      currentSelectedRaceId = null;
      
      ['res1','res2','res3','pay2','pay3','leaderCar'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('leaderEval').value = '';
      document.getElementById('resultDrawer').open = false;
      
      const pName = raceData.place ? `${raceData.place} ` : '';
      alert(`[ ${raceData.site}枠-${pName}${raceData.raceNum}R ] を消化し、統計に蓄積しました！`);
      renderPendingTabs();
    }

    function deleteRecord(id) {
      if(confirm('このレースデータを統計から削除しますか？')) {
        db = db.filter(d => d.id !== id);
        honestyDB = honestyDB.filter(d => d.id !== id);
        localStorage.setItem('bynDB', JSON.stringify(db));
        localStorage.setItem('honestyDB', JSON.stringify(honestyDB));
        renderAllDashboards();
      }
    }

    function exportData() {
      const backupObj = {
        bynDB: localStorage.getItem('bynDB') || '[]',
        honestyDB: localStorage.getItem('honestyDB') || '[]',
        pendingRaces: localStorage.getItem('pendingRaces') || '[]'
      };
      const jsonStr = JSON.stringify(backupObj);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const date = new Date().toISOString().slice(0, 10).replace(/-/g, "");
      const a = document.createElement("a");
      a.href = url;
      a.download = `byn_analyzer_backup_${date}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (confirm('現在のデータは上書きされ、バックアップ状態に戻ります。よろしいですか？')) {
            if (data.bynDB) localStorage.setItem('bynDB', data.bynDB);
            if (data.honestyDB) localStorage.setItem('honestyDB', data.honestyDB);
            if (data.pendingRaces) localStorage.setItem('pendingRaces', data.pendingRaces);
            alert('データの復元が完了しました！再読み込みします。');
            location.reload();
          }
        } catch (err) {
          alert('ファイルの読み込みに失敗しました。');
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    function renderAllDashboards() {
      renderBYNStats();
      renderMujirushiStats();
      renderChart();
      renderHonestyStats();
      renderHistoryList();
    }

    function renderHistoryList() {
      const div = document.getElementById('historyList');
      if(db.length === 0) return div.innerHTML = '<p class="text-slate-500">保存履歴なし</p>';
      
      div.innerHTML = db.slice(0,10).map(d => {
        const placeStr = d.place ? `${d.place}` : '';
        return `
          <div class="flex justify-between items-center bg-slate-800/50 p-2 rounded border border-slate-700">
            <span class="text-cyan-400 font-bold">${d.site}枠 ${placeStr}${d.raceNum}R</span>
            <span class="text-slate-300">結果: ${d.r1}-${d.r2}-${d.r3} / ${d.pay3}円</span>
            <button onclick="deleteRecord(${d.id})" class="text-red-500 hover:text-red-300 font-bold px-2 py-0.5 border border-red-900 rounded bg-red-950/50">×</button>
          </div>
        `;
      }).join('');
          }

    function renderBYNStats() {
      const div = document.getElementById('bynStats');
      const stats = { B: { total:0, mansha:0, honmeiFly:0 }, Y: { total:0, mansha:0, honmeiFly:0 }, N: { total:0, mansha:0, honmeiFly:0 } };
      
      db.forEach(d => {
        if(stats[d.site]) {
          stats[d.site].total++;
          if(d.isMansha) stats[d.site].mansha++;
          const honmeiP = d.players.find(p => p.stamp === '◎');
          if(honmeiP) {
            const hCar = Number(honmeiP.carNo);
            if (Number(d.r1) !== hCar && Number(d.r2) !== hCar && Number(d.r3) !== hCar) {
              stats[d.site].honmeiFly++;
            }
          }
        }
      });

      div.innerHTML = ['B','Y','N'].map(s => {
        const st = stats[s];
        const mRate = st.total ? Math.round((st.mansha/st.total)*100) : 0;
        const fRate = st.total ? Math.round((st.honmeiFly/st.total)*100) : 0;
        return `
          <div class="flex justify-between items-center bg-slate-800/50 p-2.5 rounded border border-slate-700">
            <div class="w-6 h-6 rounded flex items-center justify-center font-bold text-xs bg-slate-700 text-cyan-400">${s}</div>
            <div class="text-center"><div class="text-[9px] text-slate-400">万車券</div><div class="text-sm font-bold text-red-400">${mRate}%</div></div>
            <div class="text-center"><div class="text-[9px] text-slate-400">◎飛ぶ率</div><div class="text-sm font-bold text-yellow-400">${fRate}%</div></div>
            <div class="text-right text-[9px] text-slate-500">データ<br>${st.total}件</div>
          </div>
        `;
      }).join('');
    }

    function renderMujirushiStats() {
      const div = document.getElementById('mujirushiStats');
      let html = ""; let count = 0;
      
      const mujirushiStamps = ['☆', '★', '⑳', '●', '▲', '✖', '無'];

      db.forEach(d => {
        [d.r1, d.r2, d.r3].forEach((resCar, idx) => {
          const p = d.players.find(x => x.carNo === resCar);
          if(p && mujirushiStamps.includes(p.stamp)) {
            count++;
            const rank = idx + 1;
            const rankColor = rank === 1 ? 'text-yellow-500' : (rank === 2 ? 'text-slate-300' : 'text-orange-400');
            const posDesc = p.isTanki ? '単騎' : `第${p.lIdx}Lの${p.pos}`;
            const placeStr = d.place ? `${d.place}` : '';
            
            let frontStamp = "-";
            if(p.fCar) { const fp = d.players.find(x => x.carNo === p.fCar); if(fp) frontStamp = fp.stamp; }
            
            html += `
              <div class="bg-slate-800/30 p-2 border-l-2 border-yellow-500 mb-1 flex justify-between items-center">
                <div>
                  <span class="font-bold ${rankColor} mr-1">${rank}着</span>
                  <span class="text-slate-300">${d.site}枠 ${placeStr}${d.raceNum}R</span>
                  <span class="ml-1 px-1.5 py-0.5 bg-slate-900 text-yellow-400 rounded text-[10px] font-bold">${p.stamp}</span>
                </div>
                <div class="text-right text-[9px]">
                  <span class="bg-slate-900 px-1 py-0.5 rounded text-yellow-300">${posDesc}</span>
                  ${p.fCar ? `<br><span class="text-slate-500">前の印: ${frontStamp}</span>` : ''}
                </div>
              </div>
            `;
          }
        });
      });
      div.innerHTML = count > 0 ? html : '<p class="text-slate-500 p-2">まだ穴馬（☆★⑳●▲✖）のデータがありません。</p>';
              }

    function renderChart() {
      const ctx = document.getElementById('payoutChart');
      if(chartInstance) chartInstance.destroy();
      const reversedDb = [...db].reverse(); 
      const labels = reversedDb.map(d => `${d.site}${d.place ? d.place[0] : ''}${d.raceNum}R`);
      const data = reversedDb.map(d => d.pay3);
      const colors = reversedDb.map(d => d.isMansha ? '#ef4444' : '#06b6d4');

      Chart.defaults.color = '#94a3b8';
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets: [{ label: '3連単配当(円)', data, borderColor: '#334155', pointBackgroundColor: colors, pointRadius: 4, borderWidth: 2, stepped: true }] },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true }, x: { grid: { display: false } } } }
      });
    }

    function renderHonestyStats() {
      const div = document.getElementById('honestyStats');
      if (honestyDB.length === 0) return div.innerHTML = '<p class="text-slate-500">評価履歴なし</p>';
      
      const counts = honestyDB.reduce((acc, curr) => {
        if(!acc[curr.car]) acc[curr.car] = { good:0, normal:0, bad:0, perfect:0, total:0 };
        acc[curr.car][curr.eval]++; acc[curr.car].total++; return acc;
      }, {});

      div.innerHTML = Object.entries(counts).map(([car, s]) => `
        <div class="bg-slate-800/50 p-2.5 rounded flex justify-between items-center">
          <div class="w-6 h-6 rounded-full flex justify-center items-center font-bold text-xs car-${car}">${car}</div>
          <div class="flex space-x-1 text-[9px]">
            <span class="bg-blue-900 text-blue-200 px-1 rounded">決:${s.perfect}</span>
            <span class="bg-green-900 text-green-200 px-1 rounded">共:${s.good}</span>
            <span class="bg-yellow-900 text-yellow-200 px-1 rounded">独:${s.normal}</span>
            <span class="bg-red-900 text-red-200 px-1 rounded">最悪:${s.bad}</span>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
